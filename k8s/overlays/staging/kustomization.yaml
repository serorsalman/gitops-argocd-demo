apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: demo-staging

resources:
  - ../../base

namePrefix: staging-

labels:
  - pairs:
      env: staging

replicas:
  - name: demo-app
    count: 2

images:
  - name: ghcr.io/serorsalman/gitops-demo-app
    newTag: staging

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: demo-app
      spec:
        template:
          spec:
            containers:
              - name: demo-app
                env:
                  - name: ENVIRONMENT
                    value: staging

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: demo-prod

resources:
  - ../../base

namePrefix: prod-

labels:
  - pairs:
      env: prod

replicas:
  - name: demo-app
    count: 3

images:
  - name: ghcr.io/serorsalman/gitops-demo-app
    newTag: prod

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: demo-app
      spec:
        template:
          spec:
            containers:
              - name: demo-app
                env:
                  - name: ENVIRONMENT
                    value: prod
